<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGRI — MNP</title>
    <script>
      // Thème posé avant le premier rendu (évite un flash blanc en mode sombre) — voir src/theme/theme.ts
      (function () {
        var choix = null;
        try { choix = localStorage.getItem('pgri.theme'); } catch (e) {}
        var sombre = choix ? choix === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
